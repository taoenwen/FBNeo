  build_windows_msvc_x86:
    name: Build (Windows MSVC x86)
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: msys2-devel base-devel binutils mingw-w64-i686-nasm perl zip
          msystem: MINGW32

      - name: Clone
        uses: actions/checkout@v4

      - name: Build
        id: create_windows_msvc_x86_exe
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VCINSTALLDIR=%%i"
          call "%VCINSTALLDIR%\VC\Auxiliary\Build\vcvarsamd64_x86.bat"
          make -j%NUMBER_OF_PROCESSORS% vc18 RELEASEBUILD=1

      - name: Package
        id: create_windows_msvc_x86_archive
        run: |
          archive_file="${{ env.WINDOWS_MSVC_X86_ARTIFACT }}.zip"
          echo "archive_file=${archive_file}" >> $GITHUB_OUTPUT
          zip --junk-paths "${archive_file}" fbneo.exe src/license.txt fbahelpfilesrc/fbneo.chm whatsnew.html

      - name: Create Archive Path
        run: |
          echo archive_path= '${{ steps.create_windows_msvc_x86_archive.outputs.archive_file }}' > $WINDOWS_MSVC_X86_ARTIFACT_PATH

      - name: Upload Archive Path
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WINDOWS_MSVC_X86_ARTIFACT }}
          path: ${{ env.WINDOWS_MSVC_X86_ARTIFACT_PATH }}
          retention-days: 1

      - name: Upload Archive as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WINDOWS_MSVC_X86_ARCHIVE_ARTIFACT }}
          path: ${{ steps.create_windows_msvc_x86_archive.outputs.archive_file }}
          retention-days: 1

