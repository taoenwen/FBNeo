  build_linux_sdl2_x64:
    name: Build (Linux SDL2 x64)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash {0}
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install libsdl2-dev libsdl2-image-dev

      - name: Clone
        uses: actions/checkout@v4

      - name: Build
        id: create_linux_sdl2_x64_archive
        run: |
          make -j$(nproc) sdl2 SKIPDEPEND=1 RELEASEBUILD=1
          archive_file="${{ env.LINUX_SDL2_X64_ARTIFACT }}.zip"
          echo "archive_file=${archive_file}" >> $GITHUB_OUTPUT
          zip --junk-paths "${archive_file}" fbneo src/license.txt fbahelpfilesrc/fbneo.chm whatsnew.html

      - name: Create Archive Path
        run: |
          echo archive_path= '${{ steps.create_linux_sdl2_x64_archive.outputs.archive_file }}' > $LINUX_SDL2_X64_ARTIFACT_PATH

      - name: Upload Archive Path
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LINUX_SDL2_X64_ARTIFACT }}
          path: ${{ env.LINUX_SDL2_X64_ARTIFACT_PATH }}
          retention-days: 1

      - name: Upload Archive as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LINUX_SDL2_X64_ARCHIVE_ARTIFACT }}
          path: ${{ steps.create_linux_sdl2_x64_archive.outputs.archive_file }}
          retention-days: 1

