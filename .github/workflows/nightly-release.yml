  build_windows_msvc_arm64:
    name: Build (Windows MSVC ARM64)
    runs-on: windows-11-vs2026-arm
    continue-on-error: true
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Build
        id: create_windows_msvc_arm64_exe
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -version [18.0^,19.0^) -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath`) do set "VCINSTALLDIR=%%i"
          if not defined VCINSTALLDIR exit /b 1
          if not exist "%VCINSTALLDIR%\VC\Auxiliary\Build\vcvars64.bat" exit /b 1
          call "%VCINSTALLDIR%\VC\Auxiliary\Build\vcvars64.bat"
          msbuild projectfiles\visualstudio-2026\fbneo_vs2026.sln /m /property:Configuration=Release /property:Platform=ARM64 /verbosity:minimal
          set "PROJECT=projectfiles\visualstudio-2026"
          for %%F in (ctv_make.exe pgm_sprite_create.exe m68kmake.exe build_details_arm64.exe) do dumpbin /headers "%PROJECT%\hosttools\x64\Release\%%F" | findstr /C:"machine (ARM64)" /C:"machine (AA64)" /C:"machine (x64)" >nul || exit /b 1
          if not exist "%PROJECT%\ARM64\Release\fbneoarm64.exe" exit /b 1
          dumpbin /headers "%PROJECT%\ARM64\Release\fbneoarm64.exe" | findstr /C:"machine (ARM64)" /C:"machine (AA64)" >nul || exit /b 1
          findstr /C:"#define BUILD_CPU  ARM64" "%PROJECT%\generated\build_details.h" >nul || exit /b 1
          dir /s /b "%PROJECT%\ARM64\Release\obj\*mips3_x64*.obj" >nul 2>&1 && exit /b 1 || ver >nul
          dir /s /b "%PROJECT%\ARM64\Release\obj\*.asm.obj" >nul 2>&1 && exit /b 1 || ver >nul

      - name: Package
        id: create_windows_msvc_arm64_archive
        shell: pwsh
        run: |
          $archive = '${{ env.WINDOWS_MSVC_ARM64_ARTIFACT }}.zip'
          Compress-Archive -DestinationPath $archive -Force -Path `
            projectfiles/visualstudio-2026/ARM64/Release/fbneoarm64.exe, `
            src/license.txt, `
            fbahelpfilesrc/fbneo.chm, `
            whatsnew.html
          "archive_file=$archive" >> $env:GITHUB_OUTPUT

      - name: Create Archive Path
        shell: bash
        run: |
          echo archive_path= '${{ steps.create_windows_msvc_arm64_archive.outputs.archive_file }}' > $WINDOWS_MSVC_ARM64_ARTIFACT_PATH

      - name: Upload Archive Path
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WINDOWS_MSVC_ARM64_ARTIFACT }}
          path: ${{ env.WINDOWS_MSVC_ARM64_ARTIFACT_PATH }}
          retention-days: 1

      - name: Upload Archive as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WINDOWS_MSVC_ARM64_ARCHIVE_ARTIFACT }}
          path: ${{ steps.create_windows_msvc_arm64_archive.outputs.archive_file }}
          retention-days: 1

