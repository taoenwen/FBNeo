name: "nightly-release"

on:
  push:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Generate release body ----------
  create_release_body:
    name: Generate release notes
    runs-on: ubuntu-latest
    outputs:
      notes_file: ${{ steps.generate.outputs.file }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate notes
        id: generate
        run: |
          latest_sha=$(git rev-parse latest)
          git log --pretty=format:"%s (%an)" ${latest_sha}..${{ github.sha }} > commits.txt
          notes="release-notes.md"
          {
            echo "### Notes"
            echo "- The macos and linux standalone ports are not actively maintained..."
            echo "- The macos builds might first require running \`xattr -dr com.apple.quarantine ...\`"
            echo ""
            echo "### Commits since previous nightly"
            awk '{print "- " $0}' commits.txt
          } > "$notes"
          echo "file=$notes" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ steps.generate.outputs.file }}
          retention-days: 1

  # ---------- MinGW / Linux build matrix ----------
  build:
    name: Build (${{ matrix.target.name }})
    needs: [create_release_body]
    strategy:
      fail-fast: false
      matrix:
        target:
          # ---- Windows x86_64 (UCRT64) ----
          - name: Windows x86_64 (UCRT64)
            runner: windows-latest
            msystem: UCRT64
            deps: mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-nasm
            make_args: mingw BUILD_X64_EXE=1 SKIPDEPEND=1 RELEASEBUILD=1
            exe: fbneo64.exe
            artifact_name: windows-x86_64
            continue_on_error: false
          - name: Windows x86_64 Debug (UCRT64)
            runner: windows-latest
            msystem: UCRT64
            deps: mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-nasm
            make_args: mingw BUILD_X64_EXE=1 SKIPDEPEND=1
            exe: fbneo64d.exe
            artifact_name: windows-x86_64-debug
            continue_on_error: true
          # ---- Windows x86_32 (MINGW32) ----
          - name: Windows x86_32
            runner: windows-latest
            msystem: MINGW32
            deps: mingw-w64-i686-toolchain mingw-w64-i686-nasm
            make_args: mingw SKIPDEPEND=1 RELEASEBUILD=1
            exe: fbneo.exe
            artifact_name: windows-x86_32
            continue_on_error: true
          - name: Windows x86_32 Debug
            runner: windows-latest
            msystem: MINGW32
            deps: mingw-w64-i686-toolchain mingw-w64-i686-nasm
            make_args: mingw SKIPDEPEND=1
            exe: fbneod.exe
            artifact_name: windows-x86_32-debug
            continue_on_error: true
          # ---- Linux ----
          - name: Linux SDL2 x86_64
            runner: ubuntu-latest
            deps: libsdl2-dev libsdl2-image-dev
            make_args: sdl2 SKIPDEPEND=1 RELEASEBUILD=1
            exe: fbneo
            artifact_name: linux-sdl2-x86_64
            continue_on_error: true
          - name: Linux SDL1 x86_64
            runner: ubuntu-latest
            deps: libsdl1.2-dev
            make_args: sdl SKIPDEPEND=1 RELEASEBUILD=1
            exe: fbneo
            artifact_name: linux-sdl1-x86_64
            continue_on_error: true
    runs-on: ${{ matrix.target.runner }}
    continue-on-error: ${{ matrix.target.continue_on_error }}
    defaults:
      run:
        shell: ${{ contains(matrix.target.runner, 'windows') && 'msys2 {0}' || 'bash {0}' }}
    steps:
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: msys2-devel base-devel binutils ${{ matrix.target.deps }} zip wget
          msystem: ${{ matrix.target.msystem }}
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ${{ matrix.target.deps }}
      - uses: actions/checkout@v4
      - name: Build
        id: build
        run: |
          make -j$(nproc) ${{ matrix.target.make_args }}
          archive="${{ matrix.target.artifact_name }}.zip"
          echo "archive=$archive" >> $GITHUB_OUTPUT
          zip --junk-paths "$archive" ${{ matrix.target.exe }} src/license.txt fbahelpfilesrc/fbneo.chm whatsnew.html
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact_name }}
          path: ${{ steps.build.outputs.archive }}
          retention-days: 1

  # ---------- VC18 (Visual Studio 2026) parallel build with -j4 ----------
  build_vc:
    name: Build (VC18 ${{ matrix.arch }} ${{ matrix.debug && 'Debug' || 'Release' }})
    needs: [create_release_body]
    runs-on: windows-2025-vs2026   # VS2026 image; after June 15 can switch to windows-latest
    continue-on-error: ${{ matrix.arch == 'x86' }}   # allow failure for x86
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            debug: false
            exe: fbneo64.exe
            artifact_name: windows-vc-x86_64
          - arch: x64
            debug: true
            exe: fbneo64d.exe
            artifact_name: windows-vc-x86_64-debug
          - arch: x86
            debug: false
            exe: fbneo.exe
            artifact_name: windows-vc-x86_32
          - arch: x86
            debug: true
            exe: fbneod.exe
            artifact_name: windows-vc-x86_32-debug
    steps:
      - uses: actions/checkout@v4

      # Activate VS2026 Developer Command Prompt
      - name: Enable Developer Command Prompt for VS2026
        uses: ilammy/msvc-dev-cmd@v1.9.0
        with:
          arch: ${{ matrix.arch }}

      # Use cmd shell to avoid link.exe being shadowed by GNU link
      # Using -j4 to fully utilize the 4-core runner (Scheme A)
      - name: Build with makefile.vc18 (parallel -j4)
        shell: cmd
        run: |
          if "${{ matrix.arch }}"=="x64" (
            set MAKE_ARGS=BUILD_X64_EXE=1
          ) else (
            set MAKE_ARGS=
          )
          if "${{ matrix.debug }}"=="true" (
            set MAKE_ARGS=%MAKE_ARGS% DEBUG=1
          ) else (
            set MAKE_ARGS=%MAKE_ARGS% RELEASEBUILD=1
          )
          
          make -j4 -f makefile.vc18 vc %MAKE_ARGS%
          
          set ARCHIVE=${{ matrix.artifact_name }}.zip
          echo archive=%ARCHIVE% >> %GITHUB_OUTPUT%

      # Package step uses bash (safe because no cl/link calls)
      - name: Package artifacts
        shell: bash
        id: package
        run: |
          ARCHIVE=$(grep '^archive=' $GITHUB_OUTPUT | cut -d= -f2)
          zip --junk-paths "$ARCHIVE" ${{ matrix.exe }} src/license.txt fbahelpfilesrc/fbneo.chm whatsnew.html
          echo "archive=$ARCHIVE" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.package.outputs.archive }}
          retention-days: 1

  # ---------- Release ----------
  release:
    name: Publish Nightly Release
    needs: [create_release_body, build, build_vc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Download all build artifacts (MinGW + Linux + VC)
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true

      # Delete old latest release and create new one
      - name: Release new nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "latest" > /dev/null 2>&1; then
            gh release delete "latest" --cleanup-tag --yes
          fi
          gh release create "latest" \
            --title "nightly release" \
            --latest \
            --target "${{ github.sha }}" \
            --notes-file release-notes.md \
            windows-x86_64.zip \
            windows-x86_64-debug.zip \
            windows-x86_32.zip \
            windows-x86_32-debug.zip \
            linux-sdl2-x86_64.zip \
            linux-sdl1-x86_64.zip \
            windows-vc-x86_64.zip \
            windows-vc-x86_64-debug.zip \
            windows-vc-x86_32.zip \
            windows-vc-x86_32-debug.zip