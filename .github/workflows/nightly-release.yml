name: "nightly-release"

on:
  push:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
    RELEASE_BODY_ARTIFACT: release-body
    RELEASE_BODY_ARTIFACT_PATH: release-body.txt
    RELEASE_BODY_ARCHIVE_ARTIFACT: release-body-archive
    WINDOWS_MINGW_X64_ARTIFACT: windows-mingw-x64
    WINDOWS_MINGW_X64_ARTIFACT_PATH: windows-mingw-x64.txt
    WINDOWS_MINGW_X64_ARCHIVE_ARTIFACT: windows-mingw-x64-archive
#    WINDOWS_MINGW_X64_DEBUG_ARTIFACT: windows-mingw-x64-debug
#    WINDOWS_MINGW_X64_DEBUG_ARTIFACT_PATH: windows-mingw-x64-debug.txt
#    WINDOWS_MINGW_X64_DEBUG_ARCHIVE_ARTIFACT: windows-mingw-x64-debug-archive
    WINDOWS_MINGW_X86_ARTIFACT: windows-mingw-x86
    WINDOWS_MINGW_X86_ARTIFACT_PATH: windows-mingw-x86.txt
    WINDOWS_MINGW_X86_ARCHIVE_ARTIFACT: windows-mingw-x86-archive
#    WINDOWS_MINGW_X86_DEBUG_ARTIFACT: windows-mingw-x86-debug
#    WINDOWS_MINGW_X86_DEBUG_ARTIFACT_PATH: windows-mingw-x86-debug.txt
#    WINDOWS_MINGW_X86_DEBUG_ARCHIVE_ARTIFACT: windows-mingw-x86-debug-archive
    WINDOWS_UCRT64_X64_ARTIFACT: windows-ucrt64-x64
    WINDOWS_UCRT64_X64_ARTIFACT_PATH: windows-ucrt64-x64.txt
    WINDOWS_UCRT64_X64_ARCHIVE_ARTIFACT: windows-ucrt64-x64-archive
#    WINDOWS_UCRT64_X64_DEBUG_ARTIFACT: windows-ucrt64-x64-debug
#    WINDOWS_UCRT64_X64_DEBUG_ARTIFACT_PATH: windows-ucrt64-x64-debug.txt
#    WINDOWS_UCRT64_X64_DEBUG_ARCHIVE_ARTIFACT: windows-ucrt64-x64-debug-archive
    WINDOWS_MSVC_X64_ARTIFACT: windows-msvc-x64
    WINDOWS_MSVC_X64_ARTIFACT_PATH: windows-msvc-x64.txt
    WINDOWS_MSVC_X64_ARCHIVE_ARTIFACT: windows-msvc-x64-archive
#    WINDOWS_MSVC_X64_DEBUG_ARTIFACT: windows-msvc-x64-debug
#    WINDOWS_MSVC_X64_DEBUG_ARTIFACT_PATH: windows-msvc-x64-debug.txt
#    WINDOWS_MSVC_X64_DEBUG_ARCHIVE_ARTIFACT: windows-msvc-x64-debug-archive
    WINDOWS_MSVC_ARM64_ARTIFACT: windows-msvc-arm64
    WINDOWS_MSVC_ARM64_ARTIFACT_PATH: windows-msvc-arm64.txt
    WINDOWS_MSVC_ARM64_ARCHIVE_ARTIFACT: windows-msvc-arm64-archive
#    WINDOWS_MSVC_ARM64_DEBUG_ARTIFACT: windows-msvc-arm64-debug
#    WINDOWS_MSVC_ARM64_DEBUG_ARTIFACT_PATH: windows-msvc-arm64-debug.txt
#    WINDOWS_MSVC_ARM64_DEBUG_ARCHIVE_ARTIFACT: windows-msvc-arm64-debug-archive
    WINDOWS_MSVC_X86_ARTIFACT: windows-msvc-x86
    WINDOWS_MSVC_X86_ARTIFACT_PATH: windows-msvc-x86.txt
    WINDOWS_MSVC_X86_ARCHIVE_ARTIFACT: windows-msvc-x86-archive
#    WINDOWS_MSVC_X86_DEBUG_ARTIFACT: windows-msvc-x86-debug
#    WINDOWS_MSVC_X86_DEBUG_ARTIFACT_PATH: windows-msvc-x86-debug.txt
#    WINDOWS_MSVC_X86_DEBUG_ARCHIVE_ARTIFACT: windows-msvc-x86-debug-archive
    LINUX_SDL2_X64_ARTIFACT: linux-sdl2-x64
    LINUX_SDL2_X64_ARTIFACT_PATH: linux-sdl2-x64.txt
    LINUX_SDL2_X64_ARCHIVE_ARTIFACT: linux-sdl2-x64-archive
    LINUX_SDL1_X64_ARTIFACT: linux-sdl1-x64
    LINUX_SDL1_X64_ARTIFACT_PATH: linux-sdl1-x64.txt
    LINUX_SDL1_X64_ARCHIVE_ARTIFACT: linux-sdl1-x64-archive
#    MACOS_X64_ARTIFACT: macos-x64
#    MACOS_X64_ARTIFACT_PATH: macos-x64.txt
#    MACOS_X64_ARCHIVE_ARTIFACT: macos-x64-archive
#    MACOS_ARM64_ARTIFACT: macos-arm64
#    MACOS_ARM64_ARTIFACT_PATH: macos-arm64.txt
#    MACOS_ARM64_ARCHIVE_ARTIFACT: macos-arm64-archive

jobs:
  create_release_body:
    name: Create release body
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash {0}
    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        id: create_release_body_archive
        run: |
          latest_sha=$(git rev-parse latest)
          git log --pretty=format:"%s (%an)" ${latest_sha}..${{ github.sha }} > commits.txt
          archive_file="${{ env.RELEASE_BODY_ARTIFACT }}.md"
          echo "archive_file=${archive_file}" >> $GITHUB_OUTPUT
          echo "### Notes" > ${archive_file}
          echo "| Build Target              | System Requirements |" >> ${archive_file}
          echo "| ------------------------- | -------------------- |" >> ${archive_file}
          echo "| Windows MinGW x86/x64     | Windows 7+           |" >> ${archive_file}
          echo "| Windows UCRT64 x64        | Windows 10+          |" >> ${archive_file}
          echo "| Windows MSVC x86/x64      | Windows 10+          |" >> ${archive_file}
          echo "| Windows MSVC ARM64        | Windows 11 ARM64     |" >> ${archive_file}
          echo "| Linux SDL1/SDL2 x64       | Linux 64-bit         |" >> ${archive_file}
          echo "" >> ${archive_file}
          # echo "• Debug builds: with debug symbols, unoptimized, not suitable for gaming" >> ${archive_file}
          echo "" >> ${archive_file}
          echo "### Commits since previous nightly" >> ${archive_file}
          awk '{print "• " $0}' commits.txt >> ${archive_file}

      - name: Create Archive Path
        run: |
          echo archive_path= '${{ steps.create_release_body_archive.outputs.archive_file }}' > $RELEASE_BODY_ARTIFACT_PATH

      - name: Upload Archive Path
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BODY_ARTIFACT }}
          path: ${{ env.RELEASE_BODY_ARTIFACT_PATH }}
          retention-days: 1

      - name: Upload Archive as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BODY_ARCHIVE_ARTIFACT }}
          path: ${{ steps.create_release_body_archive.outputs.archive_file }}
          retention-days: 1

  build_windows_mingw_x64:
    name: Build (Windows MinGW x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: msys2-devel base-devel binutils mingw-w64-x86_64-toolchain mingw-w64-x86_64-nasm zip wget
          msystem: MINGW64

      - name: Clone
        uses: actions/checkout@v4

      - name: Build
        id: create_windows_mingw_x64_archive
        run: |
          make -j$(nproc) mingw BUILD_X64_EXE=1 SKIPDEPEND=1 RELEASEBUILD=1
          archive_file="${{ env.WINDOWS_MINGW_X64_ARTIFACT }}.zip"
          echo "archive_file=${archive_file}" >> $GITHUB_OUTPUT
          zip --junk-paths "${archive_file}" fbneo64.exe src/license.txt fbahelpfilesrc/fbneo.chm whatsnew.html

      - name: Create Archive Path
        run: |
          echo archive_path= '${{ steps.create_windows_mingw_x64_archive.outputs.archive_file }}' > $WINDOWS_MINGW_X64_ARTIFACT_PATH

      - name: Upload Archive Path
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WINDOWS_MINGW_X64_ARTIFACT }}
          path: ${{ env.WINDOWS_MINGW_X64_ARTIFACT_PATH }}
          retention-days: 1

      - name: Upload Archive as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WINDOWS_MINGW_X64_ARCHIVE_ARTIFACT }}
          path: ${{ steps.create_windows_mingw_x64_archive.outputs.archive_file }}
          retention-days: 1

