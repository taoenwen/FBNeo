      # Create new nightly
      - name: Release new nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "latest" > /dev/null 2>&1; then
            gh release delete "latest" --cleanup-tag --yes
          fi
          gh release create "latest" --title "nightly release" --latest --target "${{ github.sha }}" --notes-file "${{ steps.store_release_body.outputs.archive_path }}" \
