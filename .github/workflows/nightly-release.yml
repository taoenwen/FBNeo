  build_windows_msvc_x64:
    name: Build (Windows MSVC x64)
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: msys2-devel base-devel binutils mingw-w64-ucrt-x86_64-nasm perl zip
          msystem: UCRT64

      - name: Clone
        uses: actions/checkout@v4

      - name: Build
        id: create_windows_msvc_x64_exe
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VCINSTALLDIR=%%i"
          call "%VCINSTALLDIR%\VC\Auxiliary\Build\vcvars64.bat"
          make -j%NUMBER_OF_PROCESSORS% vc18 BUILD_X64_EXE=1 RELEASEBUILD=1

      - name: Package
        id: create_windows_msvc_x64_archive
